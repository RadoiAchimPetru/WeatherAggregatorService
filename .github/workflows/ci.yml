name: Weather Aggregator CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend (Quarkus & Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend  # Calea către proiectul Java
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run all backend tests (Unit, Integration, BDD, Contract)
        # Aceasta este comanda unică cerută în documentație
        run: ./mvnw clean test

  frontend-tests:
    name: Frontend (React & Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Calea către proiectul React
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Poți ajusta dacă folosești altă versiune
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend component tests
        run: npm test
        env:
          CI: true # Oprește Jest din a aștepta input manual (watch mode)